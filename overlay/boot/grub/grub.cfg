# Luca OS Advanced Live Bootloader Configuration
set default="0"
set timeout=5

# Load Theme
if [ -e /boot/grub/themes/luca-os/theme.txt ]; then
    insmod png
    insmod font
    set theme=/boot/grub/themes/luca-os/theme.txt
fi

menuentry "🚀 Try or Install Luca OS (Live USB with Persistence)" --class lucaos --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper persistent quiet splash maybe-ubiquity fsck.mode=skip ---
    initrd  /casper/initrd
}

menuentry "⚡ Try Luca OS (Ultra-Fast RAM Mode - toram)" --class lucaos --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper persistent toram quiet splash ---
    initrd  /casper/initrd
}

menuentry "🛡️ Try Luca OS (Safe Graphics / Software Fallback)" --class lucaos --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd  /casper/initrd
}

menuentry "💻 Install Luca OS Directly to Hard Drive" --class lucaos --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
    initrd  /casper/initrd
}

menuentry "🔍 UEFI Firmware / BIOS Settings" {
    fwsetup
}

menuentry "🔄 Reboot System" {
    reboot
}
