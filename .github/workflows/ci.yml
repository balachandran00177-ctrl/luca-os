name: Luca OS CI Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libglib2.0-bin shellcheck

      - name: Lint Shell Scripts
        run: |
          echo "Linting shell scripts..."
          shellcheck -e SC1090,SC1091,SC2086 scripts/build/*.sh || true
          shellcheck -e SC1090,SC1091,SC2086 scripts/bin/* || true

      - name: Validate Pure Python Asset Generator
        run: |
          echo "Generating and testing SVGs and PNG assets..."
          python3 scripts/build/generate-assets.py

      - name: Test All 6 GUI Applications (Headless Xvfb)
        run: |
          echo "Testing Luca OS GUI applications in virtual framebuffer..."
          xvfb-run -a python3 apps/luca-welcome/luca_welcome.py --test
          xvfb-run -a python3 apps/luca-installer/luca_installer.py --test
          xvfb-run -a python3 apps/luca-control/luca_control.py --test
          xvfb-run -a python3 apps/luca-live-creator/luca_live_creator.py --test
          xvfb-run -a python3 apps/luca-store/luca_store.py --test
          xvfb-run -a python3 apps/luca-live-hub/luca_live_hub.py --test
          echo "All 6 GUI applications initialized and tested successfully!"

      - name: Validate System Desktop Entries & Configs
        run: |
          echo "Verifying desktop launchers and syntax..."
          for f in overlay/usr/share/applications/*.desktop; do
            echo "Checking $f..."
            test -f "$f"
          done
          echo "All desktop entries verified."
